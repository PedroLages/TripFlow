<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Compass circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>

  <!-- Compass needle/arrow -->
  <path d="M 50 20 L 60 50 L 50 45 L 40 50 Z" fill="#FFFFFF"/>
  <path d="M 50 80 L 40 50 L 50 55 L 60 50 Z" fill="#E0E7FF" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="3" fill="#8B5CF6"/>

  <!-- Route path (dotted line) -->
  <path d="M 30 70 Q 35 60, 45 55" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,3" fill="none" opacity="0.5"/>
  <circle cx="30" cy="70" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>
